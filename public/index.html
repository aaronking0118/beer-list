<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Cellar Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1>🍺 Beer Cellar Tracker</h1>
      <div class="header-actions">
        <button id="addBeerBtn" class="btn-primary" onclick="openModal('add')">+ Add Beer</button>
        <!-- Analytics Button -->
        <button id="analyticsBtn" class="btn-primary" onclick="openAnalyticsModal()" style="margin-left: 0.5rem; background-color: #3182ce; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer;">Analytics</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Stats Overview Banner -->
    <section class="stats-banner">
      <div class="stat-card">
        <span class="stat-label">Total Beers</span>
        <span id="statTotalBeers" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Unique Breweries</span>
        <span id="statTotalBreweries" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Average Score</span>
        <div class="stat-score-container">
          <span id="statAvgRating" class="stat-value">0.0</span>
          <div id="statAvgStars" class="stat-stars-inline"></div>
        </div>
      </div>
    </section>

    <!-- Filters & Search Toolbar -->
    <section class="toolbar">
      <div class="search-wrapper">
        <input type="text" id="searchInput" placeholder="Search beers or breweries..." autocomplete="off">
      </div>
      <div class="filter-wrapper">
        <select id="styleFilter">
          <option value="">All Styles</option>
        </select>
      </div>
      <div class="sort-wrapper">
        <select id="sortSelect">
          <option value="recent">Sort by: Most Recent</option>
          <option value="rank-desc">Sort by: Highest Rating</option>
          <option value="name-asc">Sort by: Name (A-Z)</option>
        </select>
      </div>
    </section>

    <!-- Beer Grid Container -->
    <section id="beerGrid" class="beer-grid">
      <!-- Dynamically populated beer cards -->
    </section>
  </main>

  <!-- Add/Edit Beer Modal -->
  <div id="beerModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Add New Beer</h2>
      <div id="modalError" class="error-banner hidden"></div>
      
      <form id="beerForm">
        <input type="hidden" id="beerId">
        
        <div class="form-grid">
          <div class="form-group">
            <label for="beer_name">Beer Name *</label>
            <input type="text" id="beer_name" required>
          </div>

          <div class="form-group">
            <label for="brewery_name">Brewery Name *</label>
            <input type="text" id="brewery_name" list="breweryList" required autocomplete="off">
            <datalist id="breweryList"></datalist>
          </div>

          <div class="form-group">
            <label for="style">Style</label>
            <input type="text" id="style" placeholder="e.g. Imperial Stout, IPA">
          </div>

          <div class="form-group">
            <label for="rank">Rating (1 - 5)</label>
            <input type="number" id="rank" step="0.5" min="1" max="5" placeholder="e.g. 4.5">
          </div>

          <div class="form-group">
            <label for="abv">ABV (%)</label>
            <input type="number" id="abv" step="0.1" min="0" max="30" placeholder="e.g. 7.2">
          </div>

          <div class="form-group">
            <label for="ibu">IBU</label>
            <input type="number" id="ibu" step="1" min="0" max="200" placeholder="e.g. 65">
          </div>

          <div class="form-group">
            <label for="srm">SRM (Color)</label>
            <input type="number" id="srm" step="1" min="1" max="40" placeholder="e.g. 12">
          </div>

          <div class="form-group">
            <label for="location">Location / Venue</label>
            <input type="text" id="location" placeholder="e.g. Taproom, Home Cellar">
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" placeholder="e.g. CA">
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country" placeholder="e.g. United States">
          </div>

          <div class="form-group">
            <label for="owned_by">Parent Company / Owned By</label>
            <input type="text" id="owned_by" placeholder="Optional">
          </div>

          <div class="form-group">
            <label for="date">Date Logged / Tasted</label>
            <input type="date" id="date">
          </div>
        </div>

        <div class="form-group full-width hidden" id="akaContainer">
          <label for="aka">AKA / Alternate Name</label>
          <input type="text" id="aka" placeholder="Alternate database name reference">
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Beer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Detail View Modal -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-content detail-modal-content">
      <span class="close-btn" onclick="closeDetailModal()">&times;</span>
      <h2 id="detailTitle">Beer Details</h2>
      <div id="detailBody" class="detail-body-grid">
        <!-- Populated via JS -->
      </div>
      <div class="form-actions" style="margin-top: 1.5rem;">
        <button type="button" class="btn-secondary" onclick="closeDetailModal()">Close</button>
        <button type="button" id="detailEditBtn" class="btn-primary">Edit Entry</button>
      </div>
    </div>
  </div>

  <!-- Analytics Modal -->
  <div id="analyticsModal" class="modal hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div class="modal-content" style="background: #1a202c; color: #e2e8f0; padding: 2rem; border-radius: 10px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <button onclick="closeAnalyticsModal()" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: #a0aec0; font-size: 1.5rem; cursor: pointer;">&times;</button>
      <h2 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.5rem; border-bottom: 2px solid #2d3748; padding-bottom: 0.5rem;">Cellar Analytics & Insights</h2>
      <div id="analyticsBody">
        <!-- Dynamically populated analytics content -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
