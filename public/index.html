<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="container">
    <h1>Beer Log</h1>
    <button class="btn btn-warning" onclick="openAddModal()">+ Add New Beer</button>
  </header>

  <main class="container">
    <div id="beer-list" class="beer-grid"></div>
  </main>

  <!-- ADD NEW BEER MODAL -->
  <div class="modal-overlay" id="add-modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
      <h2 class="modal-title warning-text">Add New Beer Entry</h2>

      <form id="add-beer-form" onsubmit="handleAddBeer(event)">
        <!-- Row 1: Beer Name & Brewery -->
        <div class="form-row">
          <div class="form-group">
            <label for="add-beer-name">Beer Name *</label>
            <input type="text" id="add-beer-name" required placeholder="Beer Name">
          </div>
          <div class="form-group">
            <label for="add-brewery-name">Brewery Name *</label>
            <input type="text" id="add-brewery-name" list="brewery-list" required placeholder="Type or select brewery...">
            <datalist id="brewery-list"></datalist>
          </div>
        </div>

        <!-- Row 2: Style & Rank -->
        <div class="form-row">
          <div class="form-group">
            <label for="add-style">Style</label>
            <input type="text" id="add-style" placeholder="e.g. Pilsner">
          </div>
          <div class="form-group">
            <label for="add-rank">Rank (Decimal)</label>
            <input type="number" step="0.1" id="add-rank" placeholder="e.g. 4.5">
          </div>
        </div>

        <!-- Row 3: ABV, IBU, SRM -->
        <div class="form-row three-col">
          <div class="form-group">
            <label for="add-abv">ABV (%)</label>
            <input type="number" step="0.1" id="add-abv" placeholder="5.0">
          </div>
          <div class="form-group">
            <label for="add-ibu">IBU</label>
            <input type="number" id="add-ibu" placeholder="30">
          </div>
          <div class="form-group">
            <label for="add-srm">SRM</label>
            <input type="number" id="add-srm" placeholder="5">
          </div>
        </div>

        <!-- Row 4: State & Country -->
        <div class="form-row">
          <div class="form-group">
            <label for="add-state">State</label>
            <input type="text" id="add-state" placeholder="e.g. Texas">
          </div>
          <div class="form-group">
            <label for="add-country">Country</label>
            <input type="text" id="add-country" placeholder="e.g. USA">
          </div>
        </div>

        <!-- Row 5: Date & Location -->
        <div class="form-row">
          <div class="form-group">
            <label for="add-date">Date</label>
            <input type="date" id="add-date">
          </div>
          <div class="form-group">
            <label for="add-location">Location</label>
            <input type="text" id="add-location" placeholder="e.g. Taproom, Bar, Home">
          </div>
        </div>

        <button type="submit" class="btn btn-warning full-width mt-4">Save Beer Entry</button>
      </form>
    </div>
  </div>

  <!-- EDIT BEER MODAL -->
  <div class="modal-overlay" id="edit-modal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEditModal()">&times;</button>
      <h2 class="modal-title primary-text">Edit Beer Entry</h2>

      <form id="edit-beer-form" onsubmit="handleEditBeer(event)">
        <input type="hidden" id="edit-beer-id">

        <!-- Row 1: Beer Name & Brewery -->
        <div class="form-row">
          <div class="form-group">
            <label for="edit-beer-name">Beer Name *</label>
            <input type="text" id="edit-beer-name" required>
          </div>
          <div class="form-group">
            <label for="edit-brewery-name">Brewery Name *</label>
            <input type="text" id="edit-brewery-name" list="brewery-list-edit" required>
            <datalist id="brewery-list-edit"></datalist>
          </div>
        </div>

        <!-- Row 2: Style & Rank -->
        <div class="form-row">
          <div class="form-group">
            <label for="edit-style">Style</label>
            <input type="text" id="edit-style">
          </div>
          <div class="form-group">
            <label for="edit-rank">Rank (Decimal)</label>
            <input type="number" step="0.1" id="edit-rank">
          </div>
        </div>

        <!-- Row 3: ABV, IBU, SRM -->
        <div class="form-row three-col">
          <div class="form-group">
            <label for="edit-abv">ABV (%)</label>
            <input type="number" step="0.1" id="edit-abv">
          </div>
          <div class="form-group">
            <label for="edit-ibu">IBU</label>
            <input type="number" id="edit-ibu">
          </div>
          <div class="form-group">
            <label for="edit-srm">SRM</label>
            <input type="number" id="edit-srm">
          </div>
        </div>

        <!-- Row 4: State, Country, Owned By -->
        <div class="form-row three-col">
          <div class="form-group">
            <label for="edit-state">State</label>
            <input type="text" id="edit-state">
          </div>
          <div class="form-group">
            <label for="edit-country">Country</label>
            <input type="text" id="edit-country">
          </div>
          <div class="form-group">
            <label for="edit-owned-by">Owned By</label>
            <input type="text" id="edit-owned-by">
          </div>
        </div>

        <!-- Row 5: Date & Location -->
        <div class="form-row">
          <div class="form-group">
            <label for="edit-date">Date</label>
            <input type="date" id="edit-date">
          </div>
          <div class="form-group">
            <label for="edit-location">Location</label>
            <input type="text" id="edit-location" placeholder="e.g. Taproom, Bar, Home">
          </div>
        </div>

        <!-- Row 6: AKA & Collaborators -->
        <div class="form-row">
          <div class="form-group">
            <label for="edit-aka">AKA / Alternate Name</label>
            <input type="text" id="edit-aka" placeholder="Optional variant name">
          </div>
          <div class="form-group">
            <label for="edit-collaborators">Collaborators</label>
            <input type="text" id="edit-collaborators" placeholder="Collaborating breweries">
          </div>
        </div>

        <button type="submit" class="btn btn-primary full-width mt-4">Update Beer Entry</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
