<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Log</title>
  <style>
    :root {
      --bg-main: #060b11;
      --bg-card: #0b1420;
      --bg-input: #04070a;
      --border-color: #122133;
      --text-primary: #ffffff;
      --text-secondary: #8a99ad;
      --accent-cyan: #00bcd4;
      --accent-blue: #0288d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 2rem;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .top-bar h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    .btn-primary {
      background-color: var(--accent-cyan);
      color: #0b131f;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 1rem;
      background-color: var(--bg-card);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input, select {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.6rem;
      border-radius: 4px;
      outline: none;
      color-scheme: dark;
    }

    input[type="date"]::-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.8);
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    .beer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .beer-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .beer-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .beer-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background-color: var(--accent-cyan);
      color: #0b131f;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .beer-card h3 {
      font-size: 1.3rem;
      color: #ffffff;
      margin-bottom: 0.2rem;
      padding-right: 4rem;
    }

    .brewery-title {
      color: var(--accent-cyan);
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .card-meta p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }

    .card-meta strong {
      color: var(--text-primary);
    }

    .card-rank-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }

    .star-rating-container {
      display: inline-flex;
      align-items: center;
    }

    .star-wrapper {
      position: relative;
      display: inline-block;
      font-size: 1.1rem;
      line-height: 1;
    }

    .star.empty {
      color: #1e2d40;
    }

    .star.fill {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .card-actions {
      margin-top: 1rem;
    }

    .btn-edit {
      background-color: transparent;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Modal Styles */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.hidden {
      display: none !important;
    }

    .modal-content {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-cyan);
      color: #0b131f;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .error-banner {
      background-color: #721c24;
      color: #f8d7da;
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    /* Detail View Modal Grid */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .detail-item {
      background-color: var(--bg-input);
      padding: 0.8rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .detail-item span {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .detail-item p {
      font-size: 1rem;
      color: var(--text-primary);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <h1>Beer Log</h1>
      <button class="btn-primary" onclick="openModal('add')">+ Add New Beer</button>
    </header>

    <div class="filter-bar">
      <div class="form-group">
        <label for="searchInput">SEARCH</label>
        <input type="text" id="searchInput" placeholder="Search beer or brewery...">
      </div>
      <div class="form-group">
        <label for="styleFilter">STYLE</label>
        <select id="styleFilter">
          <option value="">All Styles</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sortSelect">SORT BY</label>
        <select id="sortSelect">
          <option value="recent">Recently Added</option>
          <option value="rank-desc">Highest Rank</option>
          <option value="name-asc">Beer Name (A-Z)</option>
        </select>
      </div>
    </div>

    <main class="beer-grid" id="beerGrid"></main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="beerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Beer</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div id="modalError" class="error-banner hidden"></div>

      <form id="beerForm">
        <input type="hidden" id="beerId">

        <div class="form-grid">
          <div class="form-group">
            <label for="beer_name">Beer Name *</label>
            <input type="text" id="beer_name" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="brewery_name">Brewery Name *</label>
            <input type="text" id="brewery_name" list="breweryList" required autocomplete="off">
            <datalist id="breweryList"></datalist>
          </div>

          <div class="form-group">
            <label for="style">Style</label>
            <input type="text" id="style">
          </div>

          <div class="form-group">
            <label for="rank">Rank (Decimal)</label>
            <input type="number" step="0.1" id="rank" min="0" max="5">
          </div>

          <div class="form-group">
            <label for="abv">ABV (%)</label>
            <input type="number" step="0.01" id="abv">
          </div>

          <div class="form-group">
            <label for="ibu">IBU</label>
            <input type="number" id="ibu">
          </div>

          <div class="form-group">
            <label for="srm">SRM</label>
            <input type="number" step="0.1" id="srm">
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state">
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country">
          </div>

          <div class="form-group">
            <label for="owned_by">Owned By</label>
            <input type="text" id="owned_by">
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" onclick="this.showPicker && this.showPicker()">
          </div>

          <div class="form-group full-width">
            <label for="location">Location</label>
            <input type="text" id="location">
          </div>

          <div class="form-group full-width hidden" id="akaContainer">
            <label for="aka">AKA / Alternate Name</label>
            <input type="text" id="aka">
          </div>
        </div>

        <button type="submit" class="btn-submit">Save Beer</button>
      </form>
    </div>
  </div>

  <!-- Detailed View Modal -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="detailTitle">Beer Details</h2>
        <button class="close-btn" onclick="closeDetailModal()">&times;</button>
      </div>

      <div class="detail-grid" id="detailBody"></div>

      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button id="detailEditBtn" class="btn-submit">Edit Beer</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
