<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beer Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-extrabold text-amber-500 tracking-tight mb-2">🍺 Beer Explorer</h1>
      <p class="text-gray-400">Search, filter, and sort through 10,000+ beers from our database</p>
    </header>

    <!-- Controls / Filters -->
    <div class="bg-gray-800 p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-3 items-center">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search beer or brewery..." 
        class="w-full md:w-1/4 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500"
      />
      <select 
        id="styleSelect" 
        class="w-full md:w-1/5 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500 cursor-pointer"
      >
        <option value="">All Styles</option>
      </select>
      <select 
        id="sortSelect" 
        class="w-full md:w-1/4 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500 cursor-pointer"
      >
        <option value="brewery_beer_name-asc">Brewery, then Beer Name (A–Z)</option>
        <option value="beer_number-asc">Beer # (Low to High)</option>
        <option value="beer_number-desc">Beer # (High to Low)</option>
        <option value="rank-desc">Rank (Highest First)</option>
        <option value="rank-asc">Rank (Lowest First)</option>
        <option value="abv-desc">ABV (Highest First)</option>
        <option value="abv-asc">ABV (Lowest First)</option>
        <option value="beer_name-asc">Name (A–Z)</option>
      </select>
      <button 
        id="searchBtn" 
        class="w-full md:w-1/6 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded-lg transition"
      >
        Search
      </button>
      <button 
        id="openAddBeerModal" 
        class="w-full md:w-1/6 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg transition"
      >
        + Add Beer
      </button>
    </div>

    <div class="flex justify-between items-center mb-4 px-1">
      <span id="resultsCount" class="text-gray-400 text-sm">Loading beers...</span>
      <span id="pageInfo" class="text-gray-400 text-sm">Page 1</span>
    </div>

    <div id="beerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div class="mt-8 flex justify-center items-center gap-4">
      <button id="prevPage" disabled class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 text-gray-200 font-semibold rounded-lg transition">← Previous</button>
      <span id="currentPageLabel" class="text-amber-500 font-bold">1</span>
      <button id="nextPage" disabled class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 text-gray-200 font-semibold rounded-lg transition">Next →</button>
    </div>

  </div>

  <!-- Beer Detail Modal -->
  <div id="beerModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold p-1">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Add Beer Modal -->
  <div id="addBeerModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="closeAddModal" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold p-1">✕</button>
      
      <h2 class="text-2xl font-bold text-amber-500 mb-4">Add New Beer Entry</h2>

      <form id="addBeerForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Beer Name *</label>
            <input type="text" name="beer_name" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Brewery Name *</label>
            <input type="text" name="brewery_name" required class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Beer #</label>
            <input type="number" name="beer_number" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Style</label>
            <input type="text" name="beer_style" placeholder="e.g. Pilsner" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Rank (Decimal)</label>
            <input type="number" step="0.1" name="rank" placeholder="e.g. 4.5" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">ABV (%)</label>
            <input type="number" step="0.01" name="abv" placeholder="5.0" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">IBU</label>
            <input type="number" name="ibu" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">SRM</label>
            <input type="number" name="srm" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">State</label>
            <input type="text" name="state" placeholder="e.g. Oregon" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Country</label>
            <input type="text" name="country" placeholder="e.g. USA" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500" />
          </div>
        </div>

        <button type="submit" class="w-full mt-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-4 rounded-lg transition">Save Beer Entry</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
