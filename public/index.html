<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beer Explorer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-extrabold text-amber-500 tracking-tight mb-2">🍺 Beer Explorer</h1>
      <p class="text-gray-400">Search and filter through 10,000+ beers from our database</p>
    </header>

    <!-- Controls / Filters -->
    <div class="bg-gray-800 p-4 rounded-xl shadow-md mb-8 flex flex-col md:flex-row gap-3 items-center">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search beer or brewery name..." 
        class="w-full md:w-1/2 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500"
      />
      <select 
        id="styleSelect" 
        class="w-full md:w-1/4 px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-500 cursor-pointer"
      >
        <option value="">All Styles</option>
      </select>
      <button 
        id="searchBtn" 
        class="w-full md:w-1/4 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded-lg transition"
      >
        Search
      </button>
    </div>

    <!-- Results Info Header -->
    <div class="flex justify-between items-center mb-4 px-1">
      <span id="resultsCount" class="text-gray-400 text-sm">Loading beers...</span>
      <span id="pageInfo" class="text-gray-400 text-sm">Page 1</span>
    </div>

    <!-- Beer Cards Grid -->
    <div id="beerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamic cards will be rendered here by app.js -->
    </div>

    <!-- Pagination Controls -->
    <div class="mt-8 flex justify-center items-center gap-4">
      <button 
        id="prevPage" 
        disabled 
        class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 text-gray-200 font-semibold rounded-lg transition"
      >
        ← Previous
      </button>
      <span id="currentPageLabel" class="text-amber-500 font-bold">1</span>
      <button 
        id="nextPage" 
        disabled 
        class="px-4 py-2 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 text-gray-200 font-semibold rounded-lg transition"
      >
        Next →
      </button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
  <script src="app.js"></script>
</body>
</html>
