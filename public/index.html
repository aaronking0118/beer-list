<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaron's Great Beer Adventure</title>
  <style>
    /* Dark Theme & Layout Styles */
    body {
      background-color: #0b0f19;
      color: #f7fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: contain;
      background-color: #111827;
      border: 2px solid #3182ce;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #f7fafc;
    }
    .btn-primary {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover {
      background-color: #2b6cb0;
    }
    .btn-secondary {
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
      min-width: 200px;
    }
    .control-group label {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .control-group input, .control-group select {
      background: #1f2937;
      border: 1px solid #374151;
      color: white;
      padding: 0.5rem;
      border-radius: 4px;
    }
    .beer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    /* Beer Card & Badge Styles */
    .beer-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }
    .beer-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #1f2937;
      color: #60a5fa;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .card-meta {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .card-meta p {
      margin: 0;
    }
    .card-rank-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .btn-edit {
      background: #374151;
      color: white;
      border: none;
      padding: 0.35rem 0.9rem;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-edit:hover {
      background: #4b5563;
    }

    /* Star Rating Fixes */
    .star-wrapper {
      position: relative;
      display: inline-block;
      font-size: 1rem;
      line-height: 1;
    }
    .star.empty {
      color: #4a5568;
    }
    .star.fill {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #111827;
      border: 1px solid #1f2937;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .form-group label {
      font-size: 0.85rem;
      color: #9ca3af;
    }
    .form-group input, .form-group textarea, .form-group select {
      background: #1f2937;
      border: 1px solid #374151;
      color: white;
      padding: 0.6rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="brand-container">
        <img src="avatar.jpg" alt="Aaron's Avatar" class="nav-avatar">
        <h1>Aaron's Great Beer Adventure</h1>
      </div>
      <button class="btn-primary" onclick="openModal('add')">+ Add New Beer</button>
    </header>

    <!-- Stats Dashboard -->
    <div id="statsDashboard" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
      <div style="background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1rem; text-align: center;">
        <div style="font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">Total Beers</div>
        <div id="statTotalBeers" style="font-size: 1.5rem; font-weight: bold; color: #f7fafc; margin-top: 0.2rem;">0</div>
      </div>
      <div style="background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1rem; text-align: center;">
        <div style="font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">Breweries</div>
        <div id="statTotalBreweries" style="font-size: 1.5rem; font-weight: bold; color: #f7fafc; margin-top: 0.2rem;">0</div>
      </div>
      <div style="background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 1rem; text-align: center;">
        <div style="font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em;">Avg Rating</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 0.3rem; margin-top: 0.2rem;">
          <div id="statAvgRating" style="font-size: 1.5rem; font-weight: bold; color: #f7fafc;">0.0</div>
          <div id="statAvgStars" style="font-size: 1.1rem; color: #fbbf24;"></div>
        </div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="searchInput">Search Beers</label>
        <input type="text" id="searchInput" placeholder="Search by name, brewery..." oninput="filterBeers()">
      </div>
      <div class="control-group">
        <label for="styleFilter">Filter by Style</label>
        <select id="styleFilter" onchange="filterBeers()">
          <option value="">All Styles</option>
        </select>
      </div>
      <div class="control-group">
        <label for="sortSelect">Sort By</label>
        <select id="sortSelect" onchange="filterBeers()">
          <option value="dateDesc">Date Added (Newest)</option>
          <option value="ratingDesc">Rating (Highest)</option>
          <option value="nameAsc">Name (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- Beer Grid -->
    <div id="beerGrid" class="beer-grid">
      <!-- Dynamic beer cards inserted here -->
    </div>
  </div>

  <!-- Add/Edit Beer Modal -->
  <div id="beerModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">Add Beer</h2>
      <div id="modalError" style="color: #f87171; font-size: 0.85rem; display:none;"></div>
      <form id="beerForm" onsubmit="saveBeer(event)" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label for="beerName">Beer Name *</label>
          <input type="text" id="beerName" required>
        </div>
        <div class="form-group">
          <label for="breweryName">Brewery *</label>
          <input type="text" id="breweryName" required>
        </div>
        <div class="form-group">
          <label for="beerStyle">Style</label>
          <input type="text" id="beerStyle" placeholder="e.g. IPA, Stout">
        </div>
        <div style="display: flex; gap: 1rem;">
          <div class="form-group" style="flex:1;">
            <label for="beerABV">ABV (%)</label>
            <input type="number" step="0.1" id="beerABV" placeholder="6.5">
          </div>
          <div class="form-group" style="flex:1;">
            <label for="beerIBU">IBU</label>
            <input type="number" id="beerIBU" placeholder="45">
          </div>
        </div>
        <div class="form-group">
          <label for="beerRating">Rating (1-5)</label>
          <input type="number" step="0.5" min="1" max="5" id="beerRating" placeholder="4.5">
        </div>
        <div class="form-group">
          <label for="beerNotes">Tasting Notes</label>
          <textarea id="beerNotes" rows="3" placeholder="Notes on flavor, aroma..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Beer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
