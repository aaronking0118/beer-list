<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beer Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <h1>Beer Log</h1>
      <button class="btn-primary" onclick="openModal('add')">+ Add New Beer</button>
    </header>

    <div class="filter-bar">
      <div class="form-group">
        <label for="searchInput">SEARCH</label>
        <input type="text" id="searchInput" placeholder="Search beer or brewery...">
      </div>
      <div class="form-group">
        <label for="styleFilter">STYLE</label>
        <select id="styleFilter">
          <option value="">All Styles</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sortSelect">SORT BY</label>
        <select id="sortSelect">
          <option value="recent">Recently Added</option>
          <option value="rank-desc">Highest Rank</option>
          <option value="name-asc">Beer Name (A-Z)</option>
        </select>
      </div>
    </div>

    <main class="beer-grid" id="beerGrid"></main>
  </div>

  <!-- Modal -->
  <div id="beerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Beer</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div id="modalError" class="error-banner hidden"></div>

      <form id="beerForm">
        <input type="hidden" id="beerId">

        <div class="form-grid">
          <div class="form-group">
            <label for="beer_name">Beer Name *</label>
            <input type="text" id="beer_name" required placeholder="MDRN IPA">
          </div>

          <div class="form-group">
            <label for="brewery_name">Brewery Name *</label>
            <input type="text" id="brewery_name" list="breweryList" required placeholder="Type or select brewery...">
            <datalist id="breweryList"></datalist>
          </div>

          <div class="form-group">
            <label for="style">Style</label>
            <input type="text" id="style">
          </div>

          <div class="form-group">
            <label for="rank">Rank (Decimal)</label>
            <input type="number" step="0.1" id="rank" min="0" max="5">
          </div>

          <div class="form-group">
            <label for="abv">ABV (%)</label>
            <input type="number" step="0.01" id="abv">
          </div>

          <div class="form-group">
            <label for="ibu">IBU</label>
            <input type="number" id="ibu">
          </div>

          <div class="form-group">
            <label for="srm">SRM</label>
            <input type="number" step="0.1" id="srm">
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state">
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <input type="text" id="country">
          </div>

          <div class="form-group">
            <label for="owned_by">Owned By</label>
            <input type="text" id="owned_by" placeholder="Parent company / Owner">
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date">
          </div>

          <div class="form-group full-width">
            <label for="location">Location</label>
            <input type="text" id="location">
          </div>

          <!-- Conditionally shown only when EDITING -->
          <div class="form-group full-width hidden" id="akaContainer">
            <label for="aka">AKA / Alternate Name</label>
            <input type="text" id="aka" placeholder="Optional variant name">
          </div>
        </div>

        <button type="submit" class="btn-submit">Save Beer</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
